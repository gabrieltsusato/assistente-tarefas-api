spring.application.name=assistente-tarefas-api-test

# Configurações do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate e JPA para ambiente de testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desabilita a verificação da API Ollama durante a inicialização dos testes (caso necessário)
spring.ai.ollama.init.pull-model-strategy=never