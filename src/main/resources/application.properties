spring.application.name=assistente-tarefas-api

spring.datasource.url=jdbc:postgresql://localhost:5432/assistente_tarefas
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
# Habilita o Flyway para gerenciar as migrações
spring.flyway.enabled=true

# Altera a criação automática do Hibernate para validação do schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:1b
